[package]
name = "bsv-tracker"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A transaction evidence state machine with host supplied headers, proofs, hints and time"
repository = "https://github.com/Calhooon/bsv-tracker"

[lib]
name = "bsv_tracker"

[features]
default = []
wasm = ["bsv-rs/wasm"]

[dependencies]
bsv-rs = { version = "0.4.1", default-features = false, features = ["transaction"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
