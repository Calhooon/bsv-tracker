[package]
name = "bsv-tracker"
version = "0.9.0-beta.4"
edition = "2021"
# The lowest toolchain that builds the crate: bsv-rs 0.6.0 calls
# slice::as_chunks, stable from 1.88 (1.87 refuses it, E0658).
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A transaction evidence state machine with host supplied headers, proofs, hints and time"
repository = "https://github.com/Calhooon/bsv-tracker"

[lib]
name = "bsv_tracker"

[features]
default = []
wasm = ["bsv-rs/wasm"]

[dependencies]
bsv-rs = { version = "=0.9.0-beta.4", default-features = false, features = ["transaction"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

# The lint bar (bsv-stack-lean #134, #135): the gate runs clippy with
# `-D warnings`, so every `warn` below blocks a merge as well.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
